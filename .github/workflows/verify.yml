name: Verify bilingual timetable
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build RailwayTickets/RailwayTickets.csproj -c Release
      - name: Check both languages against a fresh demo database
        env:
          Database__Mode: Demo
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5187
        run: |
          dotnet RailwayTickets/bin/Release/net10.0/RailwayTickets.dll > "$RUNNER_TEMP/rail.log" 2>&1 &
          trap 'kill $! || true' EXIT
          for n in {1..45}; do curl -fsS http://localhost:5187/Trips > /dev/null && break; sleep 1; done
          for culture in uk-UA en-US; do
            curl -fsS -b ".AspNetCore.Culture=c=$culture|uic=$culture" http://localhost:5187/Trips > "$RUNNER_TEMP/page"
            grep -q "lang=\"${culture%%-*}\"" "$RUNNER_TEMP/page"
          done
