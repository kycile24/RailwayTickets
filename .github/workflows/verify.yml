name: Verify bilingual timetable
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build RailwayTickets/RailwayTickets.csproj -c Release
      - name: Check both languages against a fresh demo database
        env:
          Database__Mode: Demo
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://localhost:5187
        run: |
          cd RailwayTickets
          export Bootstrap__AdminPassword="$(openssl rand -hex 24)"
          dotnet bin/Release/net10.0/RailwayTickets.dll > "$RUNNER_TEMP/rail.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for n in {1..45}; do curl -fsS http://localhost:5187/Trips > /dev/null && break; kill -0 "$pid" || { tail -50 "$RUNNER_TEMP/rail.log"; exit 1; }; sleep 1; done
          for culture in uk-UA en-US; do
            curl -fsS -b ".AspNetCore.Culture=c=$culture|uic=$culture" http://localhost:5187/Trips > "$RUNNER_TEMP/page"
            grep -q "lang=\"${culture%%-*}\"" "$RUNNER_TEMP/page"
          done
          curl -fsS -c "$RUNNER_TEMP/cookies" http://localhost:5187/Trips > "$RUNNER_TEMP/form"
          token=$(sed -n 's/.*name="__RequestVerificationToken" type="hidden" value="\([^"]*\)".*/\1/p' "$RUNNER_TEMP/form" | head -1)
          test -n "$token"
          curl -fsS -c "$RUNNER_TEMP/cookies" -b "$RUNNER_TEMP/cookies" \
            --data-urlencode "__RequestVerificationToken=$token" --data-urlencode "language=en" \
            --data-urlencode "returnUrl=/Trips" http://localhost:5187/Language/Set -o /dev/null
          curl -fsS -b "$RUNNER_TEMP/cookies" http://localhost:5187/Trips > "$RUNNER_TEMP/english"
          grep -q 'lang="en"' "$RUNNER_TEMP/english"
          grep -q 'Find trips' "$RUNNER_TEMP/english"
